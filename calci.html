<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="calci.css">
</head>
<body>

<div class="device">
  <div class="brand">
    <span class="brand-mark">Calculator</span>
    <span class="brand-dot" aria-hidden="true"></span>
  </div>

  <div class="screen">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="negate">+/-</button>
    <button class="fn" data-action="percent">%</button>
   <button class="op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>
    <button data-action="digit" data-value="7">7</button>
    <button data-action="digit" data-value="8">8</button>
    <button data-action="digit" data-value="9">9</button>
    <button class="op" data-action="operator" data-value="×" aria-label="Multiply">×</button>

    <button data-action="digit" data-value="4">4</button>
    <button data-action="digit" data-value="5">5</button>
    <button data-action="digit" data-value="6">6</button>
    <button class="op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

    <button data-action="digit" data-value="1">1</button>
    <button data-action="digit" data-value="2">2</button>
    <button data-action="digit" data-value="3">3</button>
    <button class="op" data-action="operator" data-value="+" aria-label="Add">+</button>

    <button class="span-2" data-action="digit" data-value="0">0</button>
    <button data-action="decimal" aria-label="Decimal Point">.</button>
    <button class="equals" data-action="equals" aria-label="Equals">=</button>
  </div>
</div>

<script src="calci.js"></script>

</body>
</html>
